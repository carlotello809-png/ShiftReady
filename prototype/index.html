<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShiftReady · Propuesta de diseño SaaS (prototipo)</title>
  <meta name="description" content="Prototipo navegable de la propuesta de UX/UI de ShiftReady. Datos demostrativos, sin servidor ni autenticación real.">
  <meta name="robots" content="noindex">
  <script>
    /* Theme before first paint (prototype preference only) */
    (function () {
      try {
        var t = localStorage.getItem('shiftready.proto.theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/img/favicon-64.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/platform.css">
</head>
