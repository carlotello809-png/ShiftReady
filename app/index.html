<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShiftReady</title>
  <meta name="description" content="Plataforma de formación de agentes de atención al cliente con simulaciones.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f2438">
  <script>
    /* Saved theme before the first paint (no flash) */
    (function () {
      try {
        var t = localStorage.getItem('shiftready.app.theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/img/favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/platform.css">
  <link rel="stylesheet" href="app.css">
</head>

  <script type="module" src="app.js"></script>
</body>
</html>
